version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: shared/pb/
        linters:
          - revive
          - staticcheck

formatters:
  enable:
    - gofmt
