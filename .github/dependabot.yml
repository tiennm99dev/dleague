version: 2
updates:
  # GitHub Actions — weekly digest SHA bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Go modules — server.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  # Go modules — shared.
  - package-ecosystem: gomod
    directory: /shared
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  # npm — web client.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
