name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Install buf + protoc-gen-go
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: proto lint
        run: cd proto && buf lint

      - name: proto breaking (against main)
        if: github.event_name == 'pull_request'
        run: cd proto && buf breaking --against '../.git#branch=origin/main,subdir=proto'

      - name: proto generate (verify no diff)
        run: |
          cd proto && buf generate
          cd .. && git diff --exit-code -- shared/pb || \
            { echo "::error::generated protobuf is stale; run 'make proto-gen' and commit"; exit 1; }

      # TODO: re-enable golangci-lint once the existing backlog clears.
      # Local run on d9a3975 surfaces 57 server issues + 1 shared issue:
      #   - 24x staticcheck SA1019 (nhooyr/websocket deprecated → coder/websocket)
      #   - 24x revive (missing exported-symbol comments)
      #   - 8x errcheck (swallowed errors in tests)
      #   - 1x unused (_roomStaleAfter dead const)
      # Re-enabling now would block every PR until the backlog is fixed.
      # Track in a follow-up commit; restore the two golangci-lint-action
      # steps below once `golangci-lint run` is clean locally.

      - name: test shared
        run: cd shared && go test ./...

      - name: test server (prod)
        run: cd server && go test ./...

      - name: test server (debug build)
        run: cd server && go build -tags debug ./...

      - name: build server
        run: cd server && go build ./cmd/api

      - name: build atlas-smoke CLI
        run: cd server && go build ./cmd/atlas-smoke

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: install
        run: npm ci

      - name: unit tests (vitest)
        run: npm test

      - name: production build
        run: npm run build-nolog

      - name: upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dleague-web
          path: client/web/build
