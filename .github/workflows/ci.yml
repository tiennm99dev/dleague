name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet localhost:27017/test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32  # v5.0.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install buf + protoc-gen-go
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: proto lint
        run: cd proto && buf lint

      - name: proto breaking (against main)
        if: github.event_name == 'pull_request'
        run: cd proto && buf breaking --against '../.git#branch=origin/main,subdir=proto'

      - name: proto generate (verify no diff)
        run: |
          cd proto && buf generate
          cd .. && git diff --exit-code -- shared/pb web/src/lib/pb || \
            { echo "::error::generated protobuf is stale; run 'make proto-gen' and commit"; exit 1; }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86  # v6.1.1
        with:
          version: latest
          args: --timeout=5m
          working-directory: server

      - name: golangci-lint shared
        uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86  # v6.1.1
        with:
          version: latest
          args: --timeout=5m
          working-directory: shared

      - name: Install firebase-tools
        run: sudo npm install -g firebase-tools

      - name: Start Firebase Auth emulator
        run: |
          firebase emulators:start --only auth --project dleague-dev &
          # Wait up to 30 s for port 9099 to be open.
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 9099 2>/dev/null && echo "emulator ready" && break
            [ "$i" -eq 30 ] && echo "::error::Firebase emulator did not start in 30s" && exit 1
            sleep 1
          done
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099

      - name: test shared
        run: cd shared && go test -race ./...

      - name: test server (prod)
        env:
          MONGO_TEST_URI: mongodb://mongo:27017/dleague_test
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: cd server && go test -race ./...

      - name: test server (debug build)
        run: cd server && go build -tags debug ./...

      - name: build server
        run: cd server && go build ./cmd/api

      - name: build web
        run: npm run --prefix web build

      - name: upload web artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: dleague-web
          path: web/dist/
