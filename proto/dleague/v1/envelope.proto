syntax = "proto3";

package dleague.v1;

option go_package = "github.com/tiennm99/dleague/shared/pb/dleague/v1;dleaguev1";

// MessageType identifies the payload variant inside Envelope.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_PING = 1;
  MESSAGE_TYPE_PONG = 2;
  MESSAGE_TYPE_ERROR = 3;
  MESSAGE_TYPE_AUTH_REFRESH = 4;
  MESSAGE_TYPE_AUTH_REFRESH_ACK = 5;
  MESSAGE_TYPE_GAME_MOVE = 6;
  MESSAGE_TYPE_GAME_STATE = 7;
}

// Envelope is the wire frame for every WebSocket message.
// Payload bytes are the marshaled bytes of the inner message identified by `type`.
message Envelope {
  MessageType type = 1;
  string request_id = 2;
  bytes payload = 3;
}

message Ping {
  int64 client_unix_ms = 1;
}

message Pong {
  int64 client_unix_ms = 1;
  int64 server_unix_ms = 2;
}

// Error carries a structured error response back to the client.
message Error {
  int32 code = 1;
  string message = 2;
}

// AuthRefresh is sent by the client ~50 min into a connection to rotate the
// Firebase ID token before the current one expires (tokens last 1 hour).
message AuthRefresh {
  string id_token = 1;
}

// AuthRefreshAck is the server's confirmation after successfully re-verifying
// the supplied token. expires_at_unix is the new token's expiry as Unix epoch seconds.
message AuthRefreshAck {
  int64 expires_at_unix = 1;
}
