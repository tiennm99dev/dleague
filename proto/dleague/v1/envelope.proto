syntax = "proto3";

package dleague.v1;

option go_package = "github.com/tiennm99/dleague/shared/pb/dleague/v1;dleaguev1";

// MessageType identifies the payload variant inside Envelope.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_PING = 1;
  MESSAGE_TYPE_PONG = 2;
  // First-frame auth handshake. Server expects AUTH_REQUEST as the first
  // frame after WS upgrade; replies with AUTH_RESPONSE; rejects all other
  // frames pre-handshake.
  MESSAGE_TYPE_AUTH_REQUEST = 3;
  MESSAGE_TYPE_AUTH_RESPONSE = 4;
  // Sync-PvP room lifecycle. Player joins a room keyed by matchId; server
  // verifies UID is in match.players. Once joined, TURN frames are
  // forwarded to room peers and MATCH_END persists the result.
  MESSAGE_TYPE_JOIN_ROOM = 5;
  MESSAGE_TYPE_JOIN_ROOM_ACK = 6;
  MESSAGE_TYPE_TURN = 7;
  MESSAGE_TYPE_MATCH_END = 8;
}

// Envelope is the wire frame for every WebSocket message.
// Payload bytes are the marshaled bytes of the inner message identified by `type`.
message Envelope {
  MessageType type = 1;
  string request_id = 2;
  bytes payload = 3;
}

message Ping {
  int64 client_unix_ms = 1;
}

message Pong {
  int64 client_unix_ms = 1;
  int64 server_unix_ms = 2;
}

// AuthRequest carries the Firebase ID token. Always sent as the first frame
// after WS upgrade. `version` lets the protocol evolve without breaking
// older clients.
message AuthRequest {
  string id_token = 1;
  uint32 version = 2;
}

// AuthResponse acks (ok=true) or rejects (ok=false) the handshake. On
// rejection the server closes the connection right after sending; uid is
// empty.
message AuthResponse {
  bool ok = 1;
  string uid = 2;
  string error = 3;
}

// JoinRoom requests entry to a sync-PvP room keyed by matchId.
message JoinRoom {
  string match_id = 1;
}

// JoinRoomAck. role ∈ {"p1","p2"}; opponent_uid filled on success only.
message JoinRoomAck {
  bool ok = 1;
  string match_id = 2;
  string role = 3;
  string opponent_uid = 4;
  string error = 5;
}

// Turn carries one player's move. Body is opaque to the server in v1 —
// it's relayed verbatim to the opponent.
message Turn {
  string match_id = 1;
  uint32 turn_index = 2;
  bytes payload = 3;
}

// MatchEnd reports the result. Server validates winner ∈ players,
// persists, and updates leaderboards.
message MatchEnd {
  string match_id = 1;
  string winner_uid = 2; // empty for draw
  int64 score_p1 = 3;
  int64 score_p2 = 4;
}
